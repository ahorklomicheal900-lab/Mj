services:
  - type: web
    name: alcantara-daily-sales-desk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alcantara-sales-db
          property: connectionString
      - key: INITIAL_OWNER_USERNAME
        value: alcantara
      - key: INITIAL_OWNER_PASSWORD
        sync: false
      - key: INITIAL_OWNER_DISPLAY_NAME
        value: Alcantara
      - key: SEED_DEMO_USERS
        value: "0"

databases:
  - name: alcantara-sales-db
    databaseName: alcantara_sales
    user: alcantara_sales
