<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ settings.shop_name }} — Change password</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-shell">
    <div class="auth-card solid">
        <a href="{{ url_for('index') }}" class="back-link" style="margin-bottom:1.3rem;">← Back to the desk</a>
        <p class="eyebrow">Account</p>
        <h1>Change your password</h1>
        <p class="auth-subtitle" style="margin-bottom:1.5rem;">Signed in as {{ user.display_name }}</p>

        {% if error %}<div class="msg msg-error">{{ error }}</div>{% endif %}
        {% if success %}<div class="msg msg-success">{{ success }}</div>{% endif %}

        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="field">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="field">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" minlength="6" required>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Update password</button>
        </form>
    </div>
</body>
</html>
